# The website, memdesk.app: built by tools/build-site.mjs and published
# with GitHub Pages on every push to main that changes it - the demo is
# made of the extension's and the phone app's own code, so that too. Pages must be
# set to "GitHub Actions" (Settings → Pages → Source) for this to deploy.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'PRIVACY.md'
      - 'images/**'
      - 'icons/**'
      - 'src/**'
      - 'dev/**'
      - 'addon/**'
      - 'manifest.json'
      - 'tools/build-site.mjs'
      - 'tools/build-addon.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/site.test.js
      - run: node tools/build-site.mjs --out=_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
