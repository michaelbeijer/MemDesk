<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<style>
  html, body { margin: 0; height: 100%; background: #f6f8fc; }
  @media (prefers-color-scheme: dark) { html, body { background: #131314; } }
</style>
</head>
<body>
<div id="boot" style="font: 16px/1.5 Roboto, Arial, sans-serif; color: #444746; padding: 24px;">Loading&hellip;</div>
<script>
  (function () {
    var problems = [];
    function show(message, stack) {
      var boot = document.getElementById('boot');
      if (!boot) return;
      problems.push(String(message) + (stack ? '\n' + String(stack).split('\n').slice(0, 6).join('\n') : ''));
      boot.style.color = '#b3261e';
      boot.textContent = 'The app could not start.';
      var pre = document.createElement('pre');
      pre.style.cssText = 'white-space: pre-wrap; font-size: 12px; color: #444746;';
      pre.textContent = problems.join('\n\n');
      boot.appendChild(pre);
    }
    window.addEventListener('error', function (e) {
      show((e.message || 'unknown error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''), e.error && e.error.stack);
    });
    window.addEventListener('unhandledrejection', function (e) {
      show(String((e.reason && e.reason.message) || e.reason), e.reason && e.reason.stack);
    });
    window.__bootFailed = show;
  })();
</script>
<!-- scripts -->
</body>
</html>
